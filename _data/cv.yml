- title: Research Experience
  type: time_table
  contents:
    - title: Research Scientist Intern, World Foundation Model Team
      institution: Toyota Research Institute, Los Altos, CA, USA
      year: 2026.05 – 2026.11
      description:
        - AnyWorld — a video world model with a persistent, renderable 3D Gaussian memory (lead author; CVPR 2027 submission). 100% novel-view coverage vs up to 23% unobserved for single-frame reconstruction; exported 3D beats the backbone's own 3DGS head (17.65 vs 17.04 dB, 33/40 views).
        - As conditioning, the memory keeps the generator on the recorded drive (38/39 probes lower LPIPS vs base; stops respected 8/9 vs 3/9), 2.2× less flicker, trajectory-speed adherence 1.05–1.1× vs 3–4× for the base model.
        - Real2Sim2Real with PolaRiS — VLA policies evaluated inside a generated scene; policy ranking matches the real scan (r = 0.87) and holds on the physical DROID station.
        - Closed-loop RL fine-tuning of a diffusion action head for end-to-end driving inside an action-conditioned latent world model; adopted by the end-to-end driving team, passed TMC technical review (patent filed).
    - title: Graduate Student Researcher — Spatial AI & World Models
      institution: University of Michigan (Prof. Maani Ghaffari), Ann Arbor, MI, USA
      year: 2023.09 – present
      description:
        - Gaussian world models for manipulation (with MBZUAI) — Pushing Gaussians, 0/24 → 49% per attempt on a 24-task push-to-goal benchmark; offline metrics anti-correlate with closed-loop success.
        - E3DGS (ICLR 2027 submission), Reductive Lie Neurons (ICML 2026), ReLN-Gaussian-MAE, GINIO equivariant inertial odometry (patent filed).
    - title: Research Assistant, ROAHM Lab
      institution: University of Michigan, Ann Arbor, MI, USA
      year: 2022.10 – 2023.08
      description:
        - MPPI control for contact-aware dynamic locomotion of the bipedal robot Digit.
    - title: Research Intern, Robotic Automation Team
      institution: Bear Robotics, Redwood City, CA, USA
      year: 2022.01 – 2022.04
      description:
        - Factor-graph optimization for visual-odometry SLAM.
