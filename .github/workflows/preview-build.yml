name: Preview build (ami-refresh)

# Builds the site on the preview branch WITHOUT deploying, and uploads the
# rendered _site/ as a downloadable artifact (Actions tab → run → Artifacts).
# Unzip and serve locally:  python3 -m http.server -d _site 4000
on:
  push:
    branches:
      - ami-refresh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install and Build 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade nbconvert
          export JEKYLL_ENV=production
          # Build with relative-friendly settings so the zip works from a local http.server
          bundle exec jekyll build --baseurl ""
      - name: Upload rendered site 📦
        uses: actions/upload-artifact@v4
        with:
          name: site-preview-${{ github.sha }}
          path: _site
          retention-days: 14
